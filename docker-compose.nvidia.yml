# NVIDIA CUDA llama in a container, using the official prebuilt llama.cpp server image
# (no source build). Inherits hindsight + backups from the shared base, so settings/backups
# stay identical across all modes. Auto-starts on reboot via the restart policy.
include:
  - docker-compose.base.yml

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - "./data/llama:/models"
    command:
      - "-m"
      - "/models/${MODEL_FILE:-Qwen2.5-7B-Instruct-Q4_K_M.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "11434"
      - "--alias"
      - "${MODEL_ALIAS:-qwen2.5:7b}"
      # Disable auto memory-fit: it spins/hangs on this image, and with -ngl 99 the 7B model
      # + 32k KV fits in the 3060's 12GB anyway. (Log hints "try -fit off" on this step.)
      - "-fit"
      - "off"
      - "-ngl"
      - "${LLAMA_NGL:-99}"
      - "-c"
      - "${LLAMA_CTX:-32768}"
      - "--parallel"
      - "1"
      - "--threads-http"
      - "2"
      - "--ubatch-size"
      - "${LLAMA_UBATCH_SIZE:-512}"
      - "--flash-attn"
      - "on"
    ports:
      - "${LLAMA_PORT:-11434}:11434"
    # The image's built-in healthcheck targets port 8080; override it to our actual port so
    # the container reports healthy once the model is loaded. Generous start_period covers the
    # slow first model load (faulted in through the Windows bind-mount, ~2-3 min).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # Start hindsight as soon as llama's container starts (NOT gated on llama's healthcheck,
  # which can lag during the slow first model load and would otherwise abort the whole stack).
  # The raised HINDSIGHT_API_MODEL_INIT_TIMEOUT (in base) absorbs any startup contention.
  hindsight:
    depends_on:
      llama:
        condition: service_started
